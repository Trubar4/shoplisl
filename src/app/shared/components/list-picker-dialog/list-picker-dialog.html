<div class="list-picker-dialog">
  <h2 mat-dialog-title>
    <mat-icon class="dialog-icon">list_alt</mat-icon>
    {{ data.title }}
  </h2>

  <mat-dialog-content>
    <p *ngIf="data.message" class="dialog-message">{{ data.message }}</p>

    <div class="disambiguation-options" *ngIf="(availableLists$ | async)?.length">
      <div
        *ngFor="let list of (availableLists$ | async)"
        class="disambiguation-option"
        (click)="onListSelect(list)">
        <div class="option-main">
          <div class="option-icon">
            <span>{{ list.icon || '📋' }}</span>
          </div>
          <div class="option-details">
            <div class="option-name">{{ list.name }}</div>
            <div class="option-department">{{ list.articleIds.length || 0 }} Artikel</div>
          </div>
          <div class="option-action">
            <span class="action-hint">Zu "{{ list.name }}" hinzufügen</span>
            <mat-icon>chevron_right</mat-icon>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="(availableLists$ | async)?.length === 0" class="no-lists-message">
      <mat-icon>info</mat-icon>
      <p>Keine anderen Listen verfügbar</p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      (click)="onClose()"
      class="cancel-button">
      Abbrechen
    </button>
  </mat-dialog-actions>
</div>
