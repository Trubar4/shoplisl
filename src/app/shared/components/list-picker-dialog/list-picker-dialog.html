<div class="list-picker-dialog">
  <h2 mat-dialog-title>
    <mat-icon class="dialog-icon">list_alt</mat-icon>
    {{ data.title }}
  </h2>

  <mat-dialog-content>
    <p *ngIf="data.message" class="dialog-message">{{ data.message }}</p>

    <div class="lists-container" *ngIf="(availableLists$ | async)?.length">
      <div
        *ngFor="let list of (availableLists$ | async)"
        class="list-option"
        [class.selected]="isListSelected(list.id)"
        (click)="onListSelect(list)">
        <div class="list-item">
          <span class="list-icon">{{ list.icon || '📋' }}</span>
          <span class="list-name">{{ list.name }}</span>
          <span class="list-count" *ngIf="list.articleIds?.length">
            ({{ list.articleIds.length }})
          </span>
        </div>
      </div>
    </div>

    <div *ngIf="(availableLists$ | async)?.length === 0" class="no-lists-message">
      <mat-icon>info</mat-icon>
      <p>Keine anderen Listen verfügbar</p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      (click)="onCancel()"
      class="cancel-button">
      Abbrechen
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onConfirm()"
      [disabled]="!selectedListId"
      class="confirm-button">
      Verschieben
    </button>
  </mat-dialog-actions>
</div>
