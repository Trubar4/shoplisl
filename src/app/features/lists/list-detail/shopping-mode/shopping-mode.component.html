<div class="shopping-mode">
  <!-- Select All Checkbox (visible only in selection mode) -->
  <div class="select-all-container" *ngIf="isSelectionMode">
    <mat-checkbox
      [checked]="areAllVisibleSelected"
      [indeterminate]="areSomeVisibleSelected && !areAllVisibleSelected"
      (change)="onToggleSelectAll()"
      color="primary">
      Alle auswählen
    </mat-checkbox>
  </div>

  <!-- Shopping List Content -->
  <div class="content-container">
    <app-article-list
      [departmentGroups]="(enrichedDepartmentGroups$ | async) || []"
      [mode]="'shopping'"
      [searchQuery]="searchQuery"
      [shouldHideArticle]="shouldHideArticle"
      [isSelectionMode]="isSelectionMode"
      [selectionService]="selectionService"
      (articleToggle)="onArticleToggle($event)"
      (editAmount)="onEditAmount($event)"
      (articleInfo)="onArticleInfo($event)"
      (undoCompletion)="onUndoCompletion($event)">
    </app-article-list>
  </div>

  <!-- Action Bar (visible only in selection mode) -->
  <div class="selection-action-bar" *ngIf="isSelectionMode">
    <button
      mat-stroked-button
      class="action-button"
      (click)="onMoveSelectedArticles()"
      [disabled]="!selectionService || selectionService.selectedCount === 0">
      Verschieben
    </button>
    <button
      mat-button
      class="action-button"
      (click)="onMarkSelectedAsDone()"
      [disabled]="!selectionService || selectionService.selectedCount === 0">
      Erledigt
    </button>
    <button
      mat-button
      class="action-button delete-button"
      (click)="onDeleteSelectedArticles()"
      [disabled]="!selectionService || selectionService.selectedCount === 0">
      Löschen
    </button>
  </div>

  <!-- Celebration Animation Overlay -->
  <div
    class="celebration-overlay"
    *ngIf="showCelebrationAnimation()"
    (click)="closeCelebrationAnimation()">
    <div class="celebration-content" (click)="closeCelebrationAnimation()">
      <div class="celebration-animation">
        <img
          src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZnaGJhMnhxcDZ1ZWVpZm15bm5ueTkwaGVzaGNtZWtzdTNscno4bCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/2lQCBjuFMLCOvXno4l/giphy.gif"
          alt="Celebration!"
          class="celebration-gif"
          (error)="onGifError($event)"
          (load)="onGifLoad($event)">

        <!-- Celebration Text Overlaid on Image -->
        <div class="celebration-text-overlay">
          <h2>🎉 Geschafft! 🎉</h2>
          <p>Alle Artikel erledigt!</p>
        </div>

        <!-- Fallback if GIF doesn't load -->
        <div class="gif-fallback" style="display: none;">
          <div class="emoji-celebration">🎉 👏 🎊 ✨ 🎈</div>
        </div>
      </div>
    </div>
  </div>
</div>
