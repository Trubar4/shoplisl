<div class="list-detail">
  <!-- Header -->
  <mat-toolbar color="primary" class="app-header">
    <button mat-icon-button (click)="onBack()" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="header-content">
      <span class="list-icon">{{ currentList?.icon || '📋' }}</span>
      <span class="list-name">{{ currentList?.name || 'Loading...' }}</span>
    </div>
    <span class="spacer"></span>
    
    <!-- Mode Toggle Buttons -->
    <div class="mode-toggle">
      <button 
        mat-button 
        [class.active]="currentMode() === 'shopping'"
        (click)="switchToShoppingMode()"
        class="mode-button">
        Shoppen
      </button>
      <button 
        mat-button 
        [class.active]="currentMode() === 'edit'"
        (click)="switchToEditMode()"
        class="mode-button">
        Bearbeiten
      </button>
    </div>
  </mat-toolbar>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="loading">
    <p>Liste wird geladen...</p>
  </div>

  <!-- SHOPPING MODE -->
  <div *ngIf="!isLoading() && currentMode() === 'shopping'" class="shopping-mode">

    <!-- Search Component -->
    <app-search-disambiguation
      [(searchQuery)]="searchQuery"
      [disambiguation]="searchDisambiguation$ | async"
      [placeholder]="'Artikel suchen'"
      (queryChange)="onSearchQueryChange()"
      (selectOption)="onSelectSearchDisambiguation($event)"
      (clearDisambiguation)="onClearSearchDisambiguation()">
    </app-search-disambiguation>

    <!-- Shopping Mode Component -->
    <app-shopping-mode
      [list]="currentList"
      [departmentGroups]="(departmentGroups$ | async) || []"
      [searchQuery]="searchQuery"
      [shoppingFilter]="currentShoppingFilter()"
      (articleToggle)="onArticleToggle($event)"
      (articleInfo)="onArticleInfo($event)"
      (editAmount)="onEditAmountFromList($event)"
      (undoCompletion)="onUndoArticleCompletion($event)">
    </app-shopping-mode>
  </div>

  <!-- EDIT MODE -->
  <div *ngIf="!isLoading() && currentMode() === 'edit'" class="edit-mode">

    <!-- Search Component -->
    <app-search-disambiguation
      [(searchQuery)]="searchQuery"
      [disambiguation]="searchDisambiguation$ | async"
      [placeholder]="'Artikel eingeben'"
      (queryChange)="onSearchQueryChange()"
      (selectOption)="onSelectSearchDisambiguation($event)"
      (clearDisambiguation)="onClearSearchDisambiguation()">
    </app-search-disambiguation>

    <!-- Add New Article and Department Sort Buttons -->
    <div class="add-button-container">
      <button 
        mat-raised-button 
        (click)="onCreateNewArticle()"
        class="add-article-button"
        [style.background-color]="getCurrentListColor()"
        [style.color]="getContrastColor(getCurrentListColor())">
        <mat-icon>add</mat-icon>
        Neuer Artikel
      </button>
      
      <button 
        mat-stroked-button 
        (click)="onDepartmentSort()"
        class="department-sort-button"
        [style.border-color]="getCurrentListColor()"
        [style.color]="getCurrentListColor()">
        <mat-icon>reorder</mat-icon>
        Abteilungen
      </button>
    </div>

    <!-- Content Container for Articles -->
    <div class="content-container">
      <app-article-list
        [departmentGroups]="departmentGroupsEdit$ | async"
        [mode]="'edit'"
        [searchQuery]="searchQuery"
        [shouldHideArticle]="shouldHideArticle"
        (articleToggle)="onArticleToggle($event)"
        (editAmount)="onEditAmountFromList($event)"
        (articleInfo)="onArticleInfo($event)"
        (undoCompletion)="undoArticleCompletion($event)"
        (toggleInList)="onToggleArticleInList($event)">
      </app-article-list>
    </div>

    <!-- Edit Mode Actions -->
    <div class="edit-actions">
      <button 
        mat-button 
        (click)="onClearAllItems()"
        class="action-button secondary-button"
        [style.color]="getCurrentListColor()">
        Leeren
      </button>
      <button 
        mat-button 
        (click)="onDeleteList()"
        class="action-button tertiary-button"
        [style.color]="listUtils.getLightColor(getCurrentListColor())">
        Löschen
      </button>
      <button 
        mat-raised-button 
        (click)="onEditList()"
        class="action-button primary-button"
        [style.background-color]="getCurrentListColor()"
        [style.color]="getContrastColor(getCurrentListColor())">
        Bearbeiten
      </button>
    </div>
  </div>

  <!-- FAB Filter Menu -->
  <app-filter-fab
    *ngIf="!isLoading()"
    [isExpanded]="isFabExpanded()"
    [mode]="currentMode()"
    [currentShoppingFilter]="currentShoppingFilter()"
    [currentEditFilter]="currentEditFilter()"
    (toggleExpanded)="toggleFab()"
    (close)="closeFab()"
    (filterChange)="onFilterChange($event)">
  </app-filter-fab>

</div>
