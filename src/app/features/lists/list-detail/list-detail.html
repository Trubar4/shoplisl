<div class="list-detail">
  <!-- Header -->
  <mat-toolbar color="primary" class="app-header">
    <button mat-icon-button (click)="onBack()" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="header-content">
      <span class="list-icon">{{ currentList?.icon || '📋' }}</span>
      <span class="list-name">{{ currentList?.name || 'Loading...' }}</span>
      <!-- Phase 8C: Collaborator badge -->
      <span
        *ngIf="currentList?.sharedWith && (currentList?.sharedWith?.length || 0) > 0"
        class="collaborator-badge"
        [matTooltip]="getCollaboratorTooltip()"
        matTooltipPosition="below">
        <mat-icon class="badge-icon">people</mat-icon>
        <span class="badge-count">{{ (currentList?.sharedWith?.length || 0) + 1 }}</span>
      </span>
    </div>
    <span class="spacer"></span>

    <!-- Phase 8C: Share Button (hidden during selection mode) -->
    <button
      *ngIf="!isSelectionMode()"
      mat-icon-button
      (click)="openShareDialog()"
      matTooltip="Liste teilen"
      aria-label="Liste teilen">
      <mat-icon>ios_share</mat-icon>
    </button>

    <!-- Mode Toggle Buttons (hidden during selection mode) -->
    <div class="mode-toggle" *ngIf="!isSelectionMode()">
      <button
        mat-button
        [class.active]="currentMode() === 'shopping'"
        (click)="switchToShoppingMode()"
        class="mode-button">
        Shoppen
      </button>
      <button
        mat-button
        [class.active]="currentMode() === 'edit'"
        (click)="switchToEditMode()"
        class="mode-button">
        Bearbeiten
      </button>
    </div>
  </mat-toolbar>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="loading">
    <p>Liste wird geladen...</p>
  </div>

  <!-- SHOPPING MODE -->
  <div *ngIf="!isLoading() && currentMode() === 'shopping'" class="mode-content-wrapper">

    <!-- Search and Button Row -->
    <div class="search-button-row">
      <app-search-disambiguation
        [(searchQuery)]="searchQuery"
        [disambiguation]="searchDisambiguation$ | async"
        [placeholder]="'Artikel suchen'"
        (queryChange)="onSearchQueryChange()"
        (selectOption)="onSelectSearchDisambiguation($event)"
        (clearDisambiguation)="onClearSearchDisambiguation()">
      </app-search-disambiguation>

      <!-- Auswählen Button (shown when NOT in selection mode and NOT in history mode) -->
      <button
        *ngIf="!isSelectionMode() && currentShoppingFilter() !== 'erledigt'"
        mat-raised-button
        class="selection-button"
        (click)="enterSelectionMode()"
        [style.background-color]="getCurrentListColor()">
        Auswählen
      </button>

      <!-- Exit Selection Mode Button (shown when IN selection mode and NOT in history mode) -->
      <button
        *ngIf="isSelectionMode() && currentShoppingFilter() !== 'erledigt'"
        mat-icon-button
        class="exit-selection-button"
        (click)="exitSelectionMode()"
        aria-label="Auswahl beenden">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- History Mode Component (shown when filter is 'erledigt') -->
    <app-history-mode
      *ngIf="currentShoppingFilter() === 'erledigt'"
      [list]="currentList"
      [searchQuery]="searchQuery"
      (articleRestore)="onArticleToggle($event)"
      (articleInfo)="onArticleInfo($event)">
    </app-history-mode>

    <!-- Shopping Mode Component (shown for other filters) -->
    <app-shopping-mode
      *ngIf="currentShoppingFilter() !== 'erledigt'"
      [list]="currentList"
      [departmentGroups]="(departmentGroups$ | async) || []"
      [searchQuery]="searchQuery"
      [shoppingFilter]="currentShoppingFilter()"
      [isSelectionMode]="isSelectionMode()"
      [isDialogOpen]="isDialogOpen()"
      [selectionService]="selectionService"
      (articleToggle)="onArticleToggle($event)"
      (articleInfo)="onArticleInfo($event)"
      (editAmount)="onEditAmountFromList($event)"
      (undoCompletion)="onUndoArticleCompletion($event)"
      (moveSelectedArticles)="onMoveSelectedArticles($event)"
      (deleteSelectedArticles)="onDeleteSelectedArticles($event)"
      (markSelectedAsDone)="onMarkSelectedAsDone($event)">
    </app-shopping-mode>
  </div>

  <!-- EDIT MODE -->
  <div *ngIf="!isLoading() && currentMode() === 'edit'" class="edit-mode-container">

    <!-- Search Component -->
    <app-search-disambiguation
      [(searchQuery)]="searchQuery"
      [disambiguation]="searchDisambiguation$ | async"
      [placeholder]="'Artikel eingeben'"
      (queryChange)="onSearchQueryChange()"
      (selectOption)="onSelectSearchDisambiguation($event)"
      (clearDisambiguation)="onClearSearchDisambiguation()">
    </app-search-disambiguation>

    <!-- Edit Mode Component -->
    <app-edit-mode
      [list]="currentList"
      [departmentGroups]="(departmentGroupsEdit$ | async) || []"
      [searchQuery]="searchQuery"
      [editFilter]="currentEditFilter()"
      [listColor]="getCurrentListColor()"
      [contrastColor]="getContrastColor(getCurrentListColor())"
      [lightColor]="listUtils.getLightColor(getCurrentListColor())"
      (toggleInList)="onToggleArticleInList($event)"
      (articleInfo)="onArticleInfo($event)"
      (editAmount)="onEditAmountFromList($event)"
      (createArticle)="onCreateNewArticle()"
      (departmentSort)="onDepartmentSort()"
      (clearList)="onClearAllItems()"
      (editList)="onEditList()"
      (deleteList)="onDeleteList()">
    </app-edit-mode>
  </div>

  <!-- FAB Filter Menu (hidden during selection mode) -->
  <app-filter-fab
    *ngIf="!isLoading() && !isSelectionMode()"
    [isExpanded]="isFabExpanded()"
    [mode]="currentMode()"
    [currentShoppingFilter]="currentShoppingFilter()"
    [currentEditFilter]="currentEditFilter()"
    (toggleExpanded)="toggleFab()"
    (close)="closeFab()"
    (filterChange)="onFilterChange($event)">
  </app-filter-fab>

</div>
