<!-- src/app/features/lists/add-list/add-list.html -->
<mat-toolbar color="primary">
  <button mat-icon-button (click)="onBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>{{ getTitle() }}</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="onSave()" [disabled]="!list.name.trim()">
    <mat-icon>check</mat-icon>
  </button>
</mat-toolbar>

<div class="container">
  <form (ngSubmit)="onSave()" class="list-form">
    
    <!-- List Name -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Listen-Name</mat-label>
      <input 
        matInput 
        [(ngModel)]="list.name" 
        name="listName"
        (input)="onNameInput($event)"
        placeholder="z.B. Einkaufsliste REWE"
        required
        autocomplete="off">
      <mat-icon matPrefix>edit</mat-icon>
    </mat-form-field>

    <!-- Color Selection -->
    <div class="section">
      <h3>Farbe wählen</h3>
      <div class="color-grid">
        <button 
          type="button"
          mat-mini-fab 
          *ngFor="let color of colors" 
          [style.background-color]="color.value"
          [class.selected]="list.color === color.value"
          (click)="onColorSelect(color.value)"
          [attr.aria-label]="color.name">
          <mat-icon *ngIf="list.color === color.value" class="check-icon">check</mat-icon>
        </button>
      </div>
    </div>

    <!-- Icon Selection -->
    <div class="section">
      <h3>Symbol wählen</h3>
      <div class="emoji-grid">
        <button 
          type="button"
          mat-stroked-button 
          *ngFor="let emoji of commonEmojis" 
          [class.selected]="list.icon === emoji"
          (click)="onEmojiSelect(emoji)"
          class="emoji-button">
          {{ emoji }}
        </button>
      </div>
    </div>

    <!-- Preview -->
    <div class="section">
      <h3>Vorschau</h3>
      <div class="list-preview" [style.background-color]="list.color">
        <span class="preview-icon">{{ list.icon }}</span>
        <span class="preview-name">{{ list.name || 'Listen-Name' }}</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button 
        type="button" 
        mat-stroked-button 
        (click)="onCancel()"
        class="cancel-button">
        Abbrechen
      </button>
      <button 
        type="submit" 
        mat-raised-button 
        color="primary"
        [disabled]="!list.name.trim()">
        {{ getSaveButtonText() }}
      </button>
    </div>

  </form>
</div>
